<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Пять дней до Сирены</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <section id="start-screen" class="panel">
        <h1>Пять дней до Сирены</h1>
        <p>Помоги Тюне подготовиться до пятого дня.</p>
        <button id="start-button" type="button">Играть</button>
      </section>

      <section id="game-screen" class="hidden">
        <header class="hud">
          <p>День: <span id="day-counter">1</span> / 5</p>
          <p>Время дня: <span id="day-time">20</span> сек</p>
          <p>Дерево: <span id="wood-count">0</span></p>
          <p>Металл: <span id="metal-count">0</span></p>
          <p>Еда: <span id="food-count">0</span></p>
          <p>Верстак: <span id="workbench-state">нет</span></p>
          <p>Пистолет: <span id="gun-state">нет</span></p>
          <p>Пули: <span id="ammo-count">0</span></p>
          <p>Управление: WASD/стрелки, E, Пробел</p>
        </header>
        <p id="status-message" class="status-message" aria-live="polite"></p>

        <section id="craft-menu" class="craft-menu hidden" aria-live="polite">
          <h2>Верстак</h2>
          <p>Простой крафт:</p>
          <button id="craft-workbench" type="button">Собрать верстак (дерево x3, металл x1)</button>
          <button id="craft-gun" type="button">Собрать пистолет (дерево x1, металл x3)</button>
          <button id="craft-ammo" type="button">Сделать пули (металл x1 → 6 пуль)</button>
          <button id="craft-close" type="button">Закрыть</button>
        </section>

        <canvas id="game-canvas" width="640" height="400" aria-label="Игровое поле"></canvas>
      </section>
    </main>

    <script src="game.js"></script>
  </body>
</html>
